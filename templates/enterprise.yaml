# pii-guard — Enterprise / Fintech Template
# Use for compliance agents, KYC/AML workflows, internal business tools.
# Covers standard PII + financial identifiers (account numbers, IBANs, routing numbers).

template: enterprise

# Keep regulatory terms visible to the LLM (they need them for compliance reasoning)
custom_rules:
  - name: keep_regulatory
    pattern: "(OFAC|FinCEN|SAR|AML|KYC|KYB|CTR|BSA)"
    redact: false

