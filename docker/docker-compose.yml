version: '3.8'

services:
  pii-guard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TEMPLATE=${TEMPLATE:-personal}
      # Pick ONE of these:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Optional: point to a config file mounted below
      # - CONFIG_PATH=/app/config/pii-guard-config.yaml
    volumes:
      - ./logs:/app/logs
      # Optional: mount a custom YAML config
      # - ./pii-guard-config.yaml:/app/config/pii-guard-config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
